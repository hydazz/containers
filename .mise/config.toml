[settings]
experimental = true

[tools]
jactionlint = "v2.5.0"
gh = "2.103.3"
go = "1.27.3"
hadolint = "2.15.1"
jq = "1.8.2"
lefthook = "2.2.2"
node = "26.13.0"
oxfmt = "0.75.0"
regctl = "0.11.7"
shellcheck = "0.11.0"
yq = "4.54.3"

[tasks.local-build]
description = "Build and test the selected image"
usage = '''
arg "<app>" help="App directory under apps/"
'''
run = '''
metadata=$(mktemp)
trap 'rm -f "$metadata"' EXIT
cd "apps/${usage_app?}"
docker buildx bake --no-cache --metadata-file "$metadata" --load
image=$(jq -er '."image-local"."image.name" | sub("^docker.io/library/"; "")' "$metadata")
TEST_IMAGE="$image" go test -v ./...
'''

[tasks.remote-build]
description = "Start the GitHub release workflow"
usage = '''
arg "<app>" help="App directory under apps/"
flag "--release" help="Publish the image"
'''
run = 'gh workflow run release.yaml -f app="$usage_app" -f release="${usage_release:-false}"'

[tasks.generate-label-config]
hide = true
run = '''
config=.github/labeler.yaml
yq -i 'with_entries(select(.key | test("^app/") | not))' "$config"
for dir in apps/*; do
    [ -d "$dir" ] || continue
    app=${dir##*/}
    APP="$app" yq -i '.["app/" + strenv(APP)] = [{"changed-files": [{"any-glob-to-any-file": ["apps/" + strenv(APP) + "/**/*"]}]}]' "$config"
done
'''

[hooks]
postinstall = "lefthook install"
