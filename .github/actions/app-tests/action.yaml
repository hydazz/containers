---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Tests
description: Takes an app and image then runs tests

inputs:
  app:
    description: App Name
    required: true
  image:
    description: Image
    required: true

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      env:
        MISE_NO_HOOKS: "1"
      with:
        experimental: true
        install_args: --locked go

    - name: Run Tests
      shell: bash
      env:
        APP: ${{ inputs.app }}
        TEST_IMAGE: ${{ inputs.image }}
      run: |
        go test -v ./apps/${APP}/...
