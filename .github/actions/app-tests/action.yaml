---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Tests
description: Takes an app and image then runs tests

inputs:
  app:
    description: App Name
    required: true
  image:
    description: Image
    required: true

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      env:
        MISE_NO_HOOKS: "1"
      with:
        experimental: true
        install_args: --locked go

    - name: Run Tests
      shell: bash
      env:
        APP: ${{ inputs.app }}
        TEST_IMAGE: ${{ inputs.image }}
      run: |
        go test -v ./apps/${APP}/...
